  admin_ticket_url: "https://admin.chat-keeper.com/A4HQiNnQBJ#/tickets"
  # 接收端 client token：只用于自检回读，新增接收人在这里追加
  clients:
    yangfan: "gAAAAABq_o0Rv_4H3s7cyd_xY6RjEC0Hls73AXWlTnZUXSDE3kTTRR-SZQNOIcmfiKY1_vlFX_WscZUy2dDA8SNSmORxPeHyhQ=="

