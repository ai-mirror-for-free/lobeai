# =============================================================================
# LobeAI 配置文件（正式环境 - server a）
# 所有非密钥配置仅从此文件读取，环境变量从 .env 文件读取
#
# 说明：
# - 密钥（*_PASSWORD_ENCRYPTED / ENCRYPTION_KEY）一律只放 .env，不进 yaml
# - 端口说明：25141 lobeai 自身 / 25142 new-api / 25143 其他服务（本仓库不使用）
# =============================================================================

# --- 管理员账号 ---
admin:
  username: "yang"
  email: "yf13755921935@gmail.com"

# --- PostgreSQL（new-api oneapi 库）---
database:
  host: "localhost"
  port: 2543
  db_name: "oneapi"
  username: "postgres"

# --- NewAPI 管理端 ---
newapi:
  url: "http://localhost:25142"
  username: "yang"

# --- server_b 编排器 ---
server_b:
  url: "https://mirror.chat-keeper.com"

# --- 工单 / 反馈（灰度）---
# 表结构：claude_agent 库的独立 schema `ticket`（DDL 见 docs/schema_tickets.sql，手动执行）
tickets:
  enabled: true
  # 灰度名单（小写）；不在名单里：入口不显示、直接调接口 403
  allowed_emails:
    - "2277248178@qq.com"
    - "yf13755921935@gmail.com"
    - "805928179@qq.com"
  # db_host/db_port 留空 = 复用 database.host/port（同实例）；本地测试在 config_dev.yaml 覆盖
  db_host: ""
  db_port: ""
  db_name: "claude_agent"
  attachment_dir: "data/tickets"
  retention_days: 30              # 关单后附件保留天数（按 closed_at 起算）
  auto_close_days: 7              # 管理员回复后 N 天用户无回应 → 自动关单（open 状态不自动关）
  max_files_per_message: 6
  max_file_mb: 10
  max_message_total_mb: 30
  rate_limit_per_hour: 5          # 单个邮箱每小时最多新建工单数
  attachment_url_ttl_hours: 24    # 附件签名 URL 有效期

