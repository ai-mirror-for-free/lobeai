# --- 管理员账号 ---
admin:
  username: "yang"
  email: "yf13755921935@gmail.com"

# --- PostgreSQL（new-api oneapi 库）---
# 2026-11-19：本地测试全部走本地 pg（pg-claude-dev 容器 127.0.0.1:2544），
# 不再连 A 端数据库、也不需要 SSH 隧道。
# 本地库名是 oneapi_rc45（new-api-dev 使用的库，历史名，2026-11-20 起该实例已换 rc.51 镜像但库名未改），
# 不是线上默认的 oneapi。
database:
  host: "127.0.0.1"
  port: 2544
  db_name: "oneapi_rc45"
  username: "postgres"

# --- NewAPI 管理端 ---
# dev（2026-11-21）：指向本机 new-api-dev（127.0.0.1:25142）。
#   旧值 154.64.231.128:25142 是 A 端公网，A 端已开防火墙，本机直连不通（超时），
#   导致 lobeai 建号/改额度/充值、ExperienceAPI 全部失败，所以改本地实例。
#   注意：本地实例是独立库 oneapi_rc45（用户/额度与线上分离，渠道是生产只读副本）。
newapi:
  url: "http://127.0.0.1:25142"
  username: "yang"

# --- server_b 编排器 ---
# dev 指向本机 tmux 的 server_b（127.0.0.1:9000），线上 mirror 仅 prod 用；
# lobeai 的 InviteService.reward 必须过 server_b HTTP，dev 用本机才能命中本地 /internal/invite/bonus
server_b:
  url: "http://127.0.0.1:9000"

