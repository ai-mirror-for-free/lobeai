    - "yf13755921935@gmail.com"
    - "805928179@qq.com"
    - "1178574705@qq.com"
  db_host: "127.0.0.1"
  db_port: 2544
  db_name: "claude_agent"
  attachment_dir: "data/tickets"
  retention_days: 30
  auto_close_days: 7
  max_files_per_message: 6
  max_file_mb: 10
  max_message_total_mb: 30
  rate_limit_per_hour: 50        # 本地测试放开（线上 config.yaml 仍是 5）
  attachment_url_ttl_hours: 24
  poll:
    user_overview: 20
    user_detail: 10
    admin_list: 15
    admin_detail: 10
    max_interval: 60
    idle_seconds: 600

